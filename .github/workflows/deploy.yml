name: Build and Deploy Infincode Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci --prefix client

      - name: Build frontend
        run: npm run build

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Validate backend syntax
        run: node --check server/src/index.js

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy tracked files to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          git archive --format=tar HEAD | ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" \
            'tar -xf - -C /var/www/cdswebsite/cdswebsite-main'

      - name: Build and restart on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2.pem "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
            set -e
            cd /var/www/cdswebsite/cdswebsite-main
            test -f server/.env
            npm ci --prefix client
            npm run build
            npm ci --prefix server
            pm2 restart cdswebsite-api --update-env
            pm2 save
            sudo nginx -t
            sudo systemctl reload nginx
          REMOTE