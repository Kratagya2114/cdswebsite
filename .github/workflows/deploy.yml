name: Build and Deploy CDS Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, validate, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix client

      - name: Build frontend
        run: npm run build

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Validate backend syntax
        run: node --check server/src/index.js

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          test -n "$EC2_HOST" || {
            echo "EC2_HOST secret is missing"
            exit 1
          }

          test -n "$EC2_USER" || {
            echo "EC2_USER secret is missing"
            exit 1
          }

          test -n "$EC2_SSH_KEY" || {
            echo "EC2_SSH_KEY secret is missing"
            exit 1
          }

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem

          ssh-keygen -y -f ~/.ssh/ec2.pem > /dev/null

          echo "SSH private key format is valid."

      - name: Verify SSH connectivity
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail

          # For production, pin the verified EC2 host key instead
          # of trusting the first key automatically.
          ssh \
            -i ~/.ssh/ec2.pem \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 \
            "$EC2_USER@$EC2_HOST" \
            "echo SSH_CONNECTED"

      - name: Transfer tracked repository files
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail

          git archive --format=tar HEAD |
            ssh \
              -i ~/.ssh/ec2.pem \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              "$EC2_USER@$EC2_HOST" \
              'tar -xf - -C /var/www/cdswebsite/cdswebsite-main'

      - name: Build and restart on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/ec2.pem \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'

          set -euo pipefail
          cd /var/www/cdswebsite/cdswebsite-main

          # Preserve the server-side environment configuration.
          test -f server/.env || {
            echo "ERROR: server/.env is missing; stopping deployment."
            exit 1
          }

          npm ci --prefix client
          npm run build
          npm ci --prefix server

          pm2 restart cdswebsite-api --update-env
          pm2 save

          sudo nginx -t
          sudo systemctl reload nginx

          echo "Checking backend health..."
          curl --fail --silent --show-error \
            http://127.0.0.1:5000/api/health

          echo
          echo "Checking Nginx..."
          curl --fail --silent --show-error \
            --output /dev/null \
            http://127.0.0.1/

          echo "Deployment and health checks completed."
          REMOTE

      - name: Remove SSH private key
        if: always()
        run: rm -f ~/.ssh/ec2.pem
